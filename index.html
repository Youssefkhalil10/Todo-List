<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <title>Todo List</title>
</head>
<body>
    <form class="main text-center mt-4" onsubmit="addTask(event)">
        <h1 class="text-secondary" >Todo List</h1>
        <input  class="rounded-3 me-2 shadow  " id="taskInput" type="text">
        <button class="btn btn-success shadow" type="submit">Add Task</button>
    </form>
    <div class="content  mt-3">
        <ul class="list-unstyled mt-3 me-5" id="taskList"></ul>
    </div>
    <script src="index.js">
    </script>
  </body>
</html>
